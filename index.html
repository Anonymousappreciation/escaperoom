<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d4c8d">
  <title>The Office Mystery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">🔎</span>
        <div>
          <div class="brand-title">THE OFFICE MYSTERY</div>
          <div class="brand-subtitle">A hidden-object workplace challenge</div>
        </div>
      </div>

      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">TEAM</span>
          <strong id="teamText">Team Alpha</strong>
        </div>

        <div class="hud-item">
          <span class="hud-label">CLUES</span>
          <strong><span id="clueCount">0</span>/8</strong>
        </div>

        <div class="hud-item timer">
          <span class="hud-label">TIME</span>
          <strong id="timerText">20:00</strong>
        </div>

        <div class="hud-item score">
          <span class="hud-label">SCORE</span>
          <strong id="scoreText">0</strong>
        </div>

        <button id="soundButton" class="icon-button" type="button" aria-label="Toggle sound">
          🔊
        </button>
      </div>
    </header>

    <main id="mainView" class="main-view"></main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <div id="modalBackdrop" class="modal-backdrop hidden">
      <div id="modalBox" class="modal-box" role="dialog" aria-modal="true"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
